// カード描画
function renderCards(filter) {
  const grid = document.getElementById('cardGrid');
  const filtered = filter === 'all' ? CARDS : CARDS.filter(c => c.suit === filter);
  
  let html = '';
  let currentSuit = '';
  const suitNames = {major:'大アルカナ',wands:'ワンド（火）',cups:'カップ（水）',swords:'ソード（風）',pentacles:'ペンタクル（地）'};
  
  filtered.forEach((card, i) => {
    if (filter === 'all' && card.suit !== currentSuit) {
      currentSuit = card.suit;
      html += `</div><h2 class="section-label">${suitNames[currentSuit]}</h2><div class="card-grid">`;
    }
    
    html += `
      <div class="tarot-card suit-${card.suit}" style="animation-delay:${(i%12)*0.05}s" onclick="this.classList.toggle('expanded')">
        <div class="card-header">
          <div>
            <div class="card-name-jp">${card.name}</div>
            <div class="card-name-en">${card.en}</div>
          </div>
          <div class="card-number">${card.id}</div>
        </div>
        <div class="card-keywords">
          ${card.keywords.map(k => `<span class="keyword">${k}</span>`).join('')}
        </div>
        <div class="expand-hint">タップで詳細 ▾</div>
        <div class="card-meanings">
          <div class="meaning-label upright">▲ 正位置</div>
          <div class="meaning-text">${card.upright}</div>
          <div class="meaning-label reversed">▽ 逆位置</div>
          <div class="meaning-text">${card.reversed}</div>
        </div>
      </div>`;
  });
  
  grid.innerHTML = html;
}

// フィルター
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderCards(btn.dataset.filter);
  });
});

renderCards('all');
